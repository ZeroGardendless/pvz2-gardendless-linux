<!doctype html><meta charset="utf-8"><title>Audio volume test</title>
<script type="module">
import {AudioEngine} from '/gpnext/audio/AudioEngine.js';
import {AudioPlayer} from '/gpnext/audio/AudioPlayer.js';
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const engine = new AudioEngine(window, {preferMedia: true});
try {
  await new Promise(resolve => {window.addEventListener('pointerdown', resolve, {once: true}); document.title = 'READY';});
  const frames = 44100 * 2;
  const bytes = new ArrayBuffer(44 + frames * 2);
  const data = new DataView(bytes);
  const text = (offset, value) => [...value].forEach((letter, index) => data.setUint8(offset + index, letter.charCodeAt(0)));
  text(0, 'RIFF'); data.setUint32(4, bytes.byteLength - 8, true); text(8, 'WAVE');
  text(12, 'fmt '); data.setUint32(16, 16, true); data.setUint16(20, 1, true);
  data.setUint16(22, 1, true); data.setUint32(24, 44100, true); data.setUint32(28, 88200, true);
  data.setUint16(32, 2, true); data.setUint16(34, 16, true); text(36, 'data'); data.setUint32(40, frames * 2, true);
  for (let index = 0; index < frames; index++) data.setInt16(44 + index * 2, Math.sin(index * 2 * Math.PI * 440 / 44100) * 8192, true);
  const tone = new AudioPlayer(engine, 'volume-check.wav', {kind: 'stream', duration: 2,
    bytes: bytes.byteLength, blob: new Blob([bytes], {type: 'audio/wav'})});
  tone.loop = true; tone.volume = 0.8;
  await tone.play();
  for (const volume of [0.8, 0.4, 0.1, 0, 0.1, 0.4, 0.8]) {
    tone.volume = volume;
    document.title = `PHASE: ${volume}`;
    await wait(2000);
    if (Math.abs(tone.media.audio.volume - volume) > 0.000001 || tone.media.audio.muted !== (volume === 0)) {
      throw new Error(`Backend gain ${tone.media.audio.volume}, mute ${tone.media.audio.muted}, requested ${volume}`);
    }
  }
  const source = await (await fetch('/assets/main/index.js')).text();
  const end = source.indexOf('(H,this.paused,e)');
  const fade = Function(`return ${source.slice(source.lastIndexOf('(function(', end), end)}`)();
  const controller = {_volumeScalePause: 1, _speedScalePause: 1};
  const began = performance.now();
  let previous = began;
  while (controller._volumeScalePause > 0) {
    await new Promise(requestAnimationFrame);
    const now = performance.now();
    fade(controller, true, (now - previous) / 1000); previous = now;
    tone.volume = 0.8 * controller._volumeScalePause;
    tone.playbackRate = controller._speedScalePause;
  }
  if (!tone.media.audio.muted || tone.playbackRate !== 1) throw new Error('Pause did not reach silence at normal pitch');
  document.title = `RESULT: PASS pauseFadeMs=${Math.round(performance.now() - began)}`;
} catch (error) {
  document.title = `RESULT: FAIL ${error.message}`;
} finally {
  for (const player of [...engine.players]) player.destroy();
}
</script>
