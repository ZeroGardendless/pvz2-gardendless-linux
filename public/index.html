    <script>
        (() => {
            const tauriLog = (msg) => {
                try {
                    console.debug("[Audio] " + msg);
                } catch (_) {}
            };

            const ASSET_ORIGIN = "http://127.0.0.1:8123";
            const srcDescriptor =
                Object.getOwnPropertyDescriptor(
                    HTMLMediaElement.prototype,
                    "src"
                );

            const rewriteMediaUrl = (url) => {
                try {
                    const resolved = new URL(url, location.href);

                    if (resolved.protocol !== "tauri:") {
                        return null;
                    }

                    return (
                        ASSET_ORIGIN +
                        resolved.pathname +
                        resolved.search
                    );
                } catch (_) {
                    return null;
                }
            };

            const nativeCreateElement =
                document.createElement.bind(document);

            const REAL_CAP = 8;
            const realFree = new Map();
            let totalReals = 0;

            const destroyReal = (real) => {
                try {
                    real.removeAttribute("src");
                    real.load();
                } catch (_) {}

                totalReals--;
            };

            let acquireReal = (url) => {
                const free = realFree.get(url);

                if (free && free.length) {
                    return free.pop();
                }

                if (totalReals < REAL_CAP) {
                    const r = nativeCreateElement("audio");

                    totalReals++;
                    srcDescriptor.set.call(r, url);

                    return r;
                }

                for (const [u, arr] of realFree) {
                    if (u !== url && arr.length) {
                        const victim = arr.pop();

                        if (!arr.length) {
                            realFree.delete(u);
                        }

                        try {
                            srcDescriptor.set.call(victim, url);
                        } catch (_) {}

                        return victim;
                    }
                }

                const t = nativeCreateElement("audio");

                totalReals++;
                srcDescriptor.set.call(t, url);

                t.addEventListener(
                    "ended",
                    () => {
                        destroyReal(t);
                    },
                    { once: true }
                );

                return t;
            };

            const releaseReal = (url, real) => {
                try {
                    real.pause();
                } catch (_) {}

                if (!realFree.has(url)) {
                    realFree.set(url, []);
                }

                const arr = realFree.get(url);

                if (arr.length < 2) {
                    arr.push(real);
                } else {
                    destroyReal(real);
                }
            };

            let sfxCtx = null;

            const ensureSfxCtx = () => {
                if (!sfxCtx) {
                    const AC =
                        window.AudioContext ||
                        window.webkitAudioContext;

                    sfxCtx = new AC();

                    sfxCtx.addEventListener("statechange", () => {
                        tauriLog("sfx ctx: " + sfxCtx.state);
                    });
                }

                if (sfxCtx.state === "suspended") {
                    sfxCtx.resume().catch(() => {});
                }

                return sfxCtx;
            };

            for (const evt of [
                "pointerdown",
                "mousedown",
                "touchstart",
                "keydown",
            ]) {
                window.addEventListener(
                    evt,
                    () => {
                        try {
                            ensureSfxCtx();
                        } catch (_) {}
                    },
                    true
                );
            }

            const decodeCache = new Map();
            let cachedPcmBytes = 0;

            const MAX_INFLIGHT_FETCHES = 4;
            let inflightFetches = 0;
            const fetchQueue = [];

            const pumpFetch = () => {
                while (
                    inflightFetches < MAX_INFLIGHT_FETCHES &&
                    fetchQueue.length
                ) {
                    const job = fetchQueue.shift();

                    inflightFetches++;

                    job.run()
                        .then(job.res, job.rej)
                        .finally(() => {
                            inflightFetches--;
                            pumpFetch();
                        });
                }
            };

            const queuedFetch = (url) =>
                new Promise((res, rej) => {
                    fetchQueue.push({
                        res,
                        rej,
                        run: () =>
                            fetch(
                                url.replace(
                                    ASSET_ORIGIN,
                                    "tauri://localhost"
                                )
                            ).then((r) => {
                                if (!r.ok) {
                                    throw new Error(
                                        "HTTP " + r.status
                                    );
                                }

                                return r.arrayBuffer();
                            }),
                    });

                    pumpFetch();
                });

            let decodingNow = 0;
            const decodeQueue = [];

            const pumpDecode = () => {
                while (
                    decodingNow < 3 &&
                    decodeQueue.length
                ) {
                    const job = decodeQueue.shift();

                    decodingNow++;

                    job.ctx
                        .decodeAudioData(job.ab)
                        .then((buf) => {
                            decodingNow--;
                            job.res(buf);
                            pumpDecode();
                        })
                        .catch((e) => {
                            decodingNow--;
                            job.rej(e);
                            pumpDecode();
                        });
                }
            };

            const queuedDecode = (ctx, ab) =>
                new Promise((res, rej) => {
                    decodeQueue.push({
                        ctx,
                        ab,
                        res,
                        rej,
                    });

                    pumpDecode();
                });

            const getDecoded = (url) => {
                let p = decodeCache.get(url);

                if (p) {
                    decodeCache.delete(url);
                    decodeCache.set(url, p);

                    return p;
                }

                p = queuedFetch(url)
                    .then((ab) =>
                        queuedDecode(
                            ensureSfxCtx(),
                            ab
                        )
                    )
                    .catch((e) => {
                        decodeCache.delete(url);
                        throw e;
                    });

                decodeCache.set(url, p);

                p.then((buf) => {
                    cachedPcmBytes +=
                        buf.length *
                        4 *
                        buf.numberOfChannels;

                    while (
                        cachedPcmBytes >
                            320 * 1024 * 1024 &&
                        decodeCache.size > 4

                        const oldest =
                            decodeCache
                                .keys()
                                .next().value;

                        const op =
                            decodeCache.get(oldest);

                        decodeCache.delete(oldest);

                            op

                                    cachedPcmBytes =

                                            cachedPcmBytes -
                                                b.length *
                                                    4 *
                                                    b.numberOfChannels

                                })
                                .catch(() => {});
                    }
                }).catch(() => {});

                return p;
            };

            const PROPS = [
                "volume",
                "playbackRate",
                "loop",
                "muted",
                "preservesPitch",
                "currentTime",
            ];

            const makeDummy = (httpUrl) => {
                const dummy =
                    nativeCreateElement("audio");

                dummy.__gdDummy = true;
                dummy.__gdHttpUrl = httpUrl;

                const state = {
                    volume: 1,
                    playbackRate: 1,
                    loop: false,
                    muted: false,
                    preservesPitch: true,
                    currentTime: 0,
                    __dom: true,
                    playing: false,
                    dur: 0,
                    playStart: 0,
                };

                dummy.__gdState = state;

                let real = null;
                let tutimer = null;

                const stopTutimer = () => {
                    if (tutimer) {
                        clearInterval(tutimer);
                        tutimer = null;
                    }
                };

                const startTutimer = () => {
                    stopTutimer();

                    tutimer = setInterval(() => {
                        try {
                            dummy.dispatchEvent(
                                new Event("timeupdate")
                            );
                        } catch (_) {}
                    }, 250);
                };

                const emitPlaying = () => {
                    state.playing = true;
                    state.playStart =
                        performance.now();

                    try {
                        dummy.dispatchEvent(
                            new Event("play")
                        );
                    } catch (_) {}

                    try {
                        dummy.dispatchEvent(
                            new Event("playing")
                        );
                    } catch (_) {}

                    startTutimer();
                };

                const emitStopped = (ev) => {
                    state.playing = false;
                    stopTutimer();

                    if (ev) {
                        try {
                            dummy.dispatchEvent(
                                new Event(ev)
                            );
                        } catch (_) {}
                    }
                };

                for (const p of PROPS) {
                    Object.defineProperty(
                        dummy,
                        p,
                        {
                            get() {
                                return real
                                    ? real[p]
                                    : state[p];
                            },

                            set(v) {
                                state[p] = v;

                                if (real) {
                                    try {
                                        real[p] = v;
                                    } catch (_) {}
                                }
                            },

                            configurable: true,
                        }
                    );
                }

                Object.defineProperty(
                    dummy,
                    "readyState",
                    {
                        get() {
                            return real
                                ? real.readyState
                                : 4;
                        },

                        configurable: true,
                    }
                );

                Object.defineProperty(
                    dummy,
                    "duration",
                    {
                        get() {
                            return real
                                ? real.duration
                                : state.dur;
                        },

                        configurable: true,
                    }
                );

                Object.defineProperty(
                    dummy,
                    "paused",
                    {
                        get() {
                            return real
                                ? real.paused
                                : !state.playing;
                        },

                        configurable: true,
                    }
                );

                Object.defineProperty(
                    dummy,
                    "currentTime",
                    {
                        get() {
                            if (real) {
                                return real.currentTime;
                            }

                            return state.playing
                                ? ((performance.now() -
                                      state.playStart) /
                                      1000) *
                                      (state.playbackRate ||
                                          1)
                                : state.currentTime;
                        },

                        set(v) {
                            state.currentTime = v;
                            state.playStart =
                                performance.now();

                            if (real) {
                                try {
                                    real.currentTime = v;
                                } catch (_) {}
                            }
                        },

                        configurable: true,
                    }
                );

                let sfxSource = null;
                let sfxGain = null;

                const dummyPlay = function () {
                    const url =
                        dummy.__gdHttpUrl;

                    if (state.__dom) {
                        if (!real) {
                            real = acquireReal(url);

                            for (const p of PROPS) {
                                try {
                                    real[p] =
                                        state[p];
                                } catch (_) {}
                            }

                            if (!real.__gdBound) {
                                real.__gdBound = true;

                                real.addEventListener(
                                    "loadedmetadata",
                                    () => {
                                        state.dur =
                                            real.duration ||
                                            state.dur;
                                    }
                                );

                                real.addEventListener(
                                    "ended",
                                    () => {
                                        emitStopped(
                                            "ended"
                                        );

                                        releaseReal(
                                            url,
                                            real
                                        );

                                        real = null;
                                    }
                                );
                            }
                        }

                        const dur =
                            real.duration ||
                            state.dur ||
                            0;

                        const seek =
                            state.currentTime > 0 &&
                            state.currentTime <
                                dur - 0.05
                                ? state.currentTime
                                : 0;

                        try {
                            real.currentTime =
                                seek;
                        } catch (_) {}

                        state.currentTime = 0;

                        const pr = real.play();

                        emitPlaying();

                        return pr;
                    }

                    const ctx = ensureSfxCtx();

                    if (ctx.state !== "running") {
                        console.error("[Audio] play rejected, ctx:", ctx.state);
                        return Promise.reject(
                            new Error(
                                "sfx ctx " + ctx.state
                            )
                        );
                    }

                    if (sfxSource) {
                        try {
                            sfxSource.onended = null;
                            sfxSource.stop();
                        } catch (_) {}

                        sfxSource = null;
                    }

                    return getDecoded(url)
                        .then((buffer) => {
                            const srcNode =
                                ctx.createBufferSource();

                            srcNode.buffer = buffer;

                            srcNode.playbackRate.value =
                                state.playbackRate ||
                                1;

                            srcNode.loop =
                                !!state.loop;

                            state.dur =
                                buffer.duration;

                            sfxGain =
                                ctx.createGain();

                            sfxGain.gain.value =
                                state.volume != null
                                    ? state.volume
                                    : 1;

                            srcNode.connect(
                                sfxGain
                            );

                            sfxGain.connect(
                                ctx.destination
                            );

                            srcNode.onended = () => {
                                if (
                                    sfxSource ===
                                    srcNode
                                ) {
                                    sfxSource = null;
                                    emitStopped(
                                        "ended"
                                    );
                                }
                            };

                            sfxSource = srcNode;

                            const offset =
                                Math.min(
                                    state.currentTime ||
                                        0,
                                    Math.max(
                                        0,
                                        buffer.duration -
                                            0.01
                                    )
                                );

                            srcNode.start(
                                0,
                                offset
                            );

                            state.currentTime = 0;
                            emitPlaying();
                        })
                        .catch((e) => {
                            console.error("[Audio] sfx play failed:", String(e));
                        });
                };

                dummy.pause = function () {
                    if (sfxSource) {
                        try {
                            sfxSource.onended =
                                null;
                            sfxSource.stop();
                        } catch (_) {}

                        sfxSource = null;

                        emitStopped("pause");

                    if (real) {
                        try {
                            real.pause();
                        } catch (_) {}

                        emitStopped("pause");

                        setTimeout(() => {
                            if (
                                real &&
                                real.paused
                            ) {
                                releaseReal(
                                    dummy.__gdHttpUrl,
                                    real
                                );

                                real = null;
                            }
                        }, 5000);
                    }
                };

                dummy.play = function (...args) {
                    if (
                        !state.__routed &&
                        dummy.__gdRouteReady
                    ) {
                        return dummy.__gdRouteReady.then(
                            () =>
                                dummyPlay(...args)
                        );
                    }

                    return dummyPlay(...args);
                };

                dummy.load = function () {};

                dummy.__gdUnbind = function () {
                    if (sfxSource) {
                        try {
                            sfxSource.onended =
                                null;
                            sfxSource.stop();
                        } catch (_) {}

                        sfxSource = null;
                    }

                    if (real) {
                        try {
                            real.pause();
                        } catch (_) {}

                        releaseReal(
                            dummy.__gdHttpUrl,
                            real
                        );

                        real = null;
                    }

                    state.playing = false;
                    stopTutimer();
                };

                return dummy;
            };

            window.__gdAcquireAudio = (rawUrl) => {
                const httpUrl =
                    rewriteMediaUrl(rawUrl);

                if (!httpUrl) {
                    return nativeCreateElement(
                        "audio"
                    );
                }

                const dummy =
                    makeDummy(httpUrl);

                dummy.__gdRouteReady =
                    getDecoded(httpUrl)
                        .then((buffer) => {
                            dummy.__gdState.__routed =
                                true;

                            if (buffer.duration > 30) {
                                dummy.__gdState.__dom =
                                    true;

                                decodeCache.delete(
                                    httpUrl
                                );
                            } else {
                                dummy.__gdState.__dom =
                                    false;
                            }
                        })
                        .catch(() => {});

                return dummy;
            };

            const aelOrig =
                EventTarget.prototype.addEventListener;

            EventTarget.prototype.addEventListener =
                function (
                    type,
                    listener,
                    ...rest
                ) {
                    if (
                        this instanceof
                            HTMLMediaElement &&
                        this.__gdDummy &&
                        (
                            type ===
                                "canplaythrough" ||
                            type === "canplay" ||
                            type ===
                                "loadedmetadata"
                        )
                    ) {
                        const el = this;

                        queueMicrotask(() => {
                            try {
                                el.dispatchEvent(
                                    new Event(type)
                                );
                            } catch (_) {}
                        });
                    }

                    return aelOrig.call(
                        this,
                        type,
                        listener,
                        ...rest
                    );
                };

            Object.defineProperty(
                HTMLMediaElement.prototype,
                "src",
                {
                    ...srcDescriptor,

                    set(url) {
                        if (typeof url === "string") {
                            const httpUrl =
                                rewriteMediaUrl(
                                    url
                                );

                            if (httpUrl) {
                                if (
                                    this.__gdDummy
                                ) {
                                    if (
                                        this.__gdHttpUrl !==
                                            httpUrl &&
                                        this.__gdUnbind
                                    ) {
                                        this.__gdUnbind();
                                    }

                                    this.__gdHttpUrl =
                                        httpUrl;

                                    return;
                                }

                                if (
                                    srcDescriptor.get.call(
                                        this
                                    ) !== httpUrl
                                ) {
                                    srcDescriptor.set.call(
                                        this,
                                        httpUrl
                                    );
                                }

                                return;
                            }
                        }

                        srcDescriptor.set.call(
                            this,
                            url
                        );
                    },
                }
            );

            const nativeSetAttribute =
                Element.prototype.setAttribute;

            Element.prototype.setAttribute =
                function (name, value) {
                    if (
                        this instanceof
                            HTMLMediaElement &&
                        String(name).toLowerCase() ===
                            "src" &&
                        typeof value === "string" &&
                        rewriteMediaUrl(value)
                    ) {
                        this.src = value;
                        return;
                    }

                    return nativeSetAttribute.call(
                        this,
                        name,
                        value
                    );
                };

            const NativeAudio = window.Audio;

            window.Audio = function (url) {
                const element =
                    new NativeAudio();

                if (
                    typeof url === "string" &&
                    url
                ) {
                    element.src = url;
                }

                return element;
            };

            window.Audio.prototype =
                NativeAudio.prototype;

            tauriLog(
                "WebKitGTK media: dummy-element proxy + pooled real pipelines enabled"
            );
        })();
