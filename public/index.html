        <!-- Network Bypass: Stops official update checks from throwing console errors -->
        <script>
            const originalFetch = window.fetch;
            window.fetch = async function (...args) {
                const requestUrl =
                    typeof args[0] === "string" ? args[0] : args[0] instanceof Request ? args[0].url : "";
                if (requestUrl.includes("pvzge.com/jsons/")) {
                    return new Response(JSON.stringify({ status: "offline_bypass" }), {
                        status: 200,
                        headers: { "Content-Type": "application/json" },
                    });
                }
                return originalFetch.apply(this, args);
            };
        </script>

        <!-- Linux / WebKitGTK media playback fix (WebKit bug 146351) -->
<script>
            (() => {
                // WebKitGTK plays <audio> elements through GStreamer, which cannot
                // fetch tauri:// URLs (WebKit bug 146351) and starves on the
                // engine's preload storm. The Rust side serves the frontend over
                // loopback HTTP, and this shim gives the engine DUMMY elements:
                // they report instant "loaded" (so preloading thousands of clips
                // costs nothing) and only bind a real, pooled media element at the
                // moment a sound actually plays. At most REAL_CAP pipelines exist.

                const tauriLog = (msg) => {
                    try { console.debug('[Audio] ' + msg); } catch (_) { /* ignore */ }
                };

                const ASSET_ORIGIN = 'http://127.0.0.1:8123';
                const srcDescriptor = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'src');

                // Map a game asset URL (relative or tauri:// absolute) to the local
                // HTTP server; null for anything that is not a game asset.
                const rewriteMediaUrl = (url) => {
                    try {
                        const resolved = new URL(url, location.href);
                        if (resolved.protocol !== 'tauri:') return null;
                        return ASSET_ORIGIN + resolved.pathname + resolved.search;
                    } catch (_) {
                        return null;
                    }
                };

                // Pristine constructor, captured before any wrapping.
                const nativeCreateElement = document.createElement.bind(document);

                // --- real element pool ---
                const REAL_CAP = 8;
                const realFree = new Map(); // httpUrl -> [free real elements]
                let totalReals = 0;

                const destroyReal = (real) => {
                    try {
                        real.removeAttribute('src');
                        real.load();
                    } catch (_) { /* already gone */ }
                    totalReals--;
                };

                let acquireReal = (url) => {
                    const free = realFree.get(url);
                    if (free && free.length) return free.pop();
                    if (totalReals < REAL_CAP) {
                        const r = nativeCreateElement('audio');
                        totalReals++;
                        srcDescriptor.set.call(r, url);
                        return r;
                    }
                    // Every slot busy: take a free element of another clip and
                    // repurpose it, else create one transient overload element.
                    for (const [u, arr] of realFree) {
                        if (u !== url && arr.length) {
                            const victim = arr.pop();
                            if (!arr.length) realFree.delete(u);
                            try { srcDescriptor.set.call(victim, url); } catch (_) { /* gone */ }
                            return victim;
                        }
                    }
                    const t = nativeCreateElement('audio');
                    totalReals++;
                    srcDescriptor.set.call(t, url);
                    t.addEventListener('ended', () => { destroyReal(t); }, { once: true });
                    return t;
                };

                const releaseReal = (url, real) => {
                    try { real.pause(); } catch (_) { /* gone */ }
                    if (!realFree.has(url)) realFree.set(url, []);
                    const arr = realFree.get(url);
                    if (arr.length < 2) arr.push(real);
                    else destroyReal(real);
                };

                // --- WebAudio SFX engine ---
                // Media-element pipelines cost 50-150ms of main thread to build in
                // WebKitGTK; a PvZ2 SFX storm overlaps dozens of one-shots, so
                // elements can never keep up. Short clips are decoded ONCE through
                // decodeAudioData and replayed as buffer sources (zero pipelines).
                // Long clips (music) keep the DOM path.
                let sfxCtx = null;
                const ensureSfxCtx = () => {
                    if (!sfxCtx) {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        sfxCtx = new AC();
                        sfxCtx.addEventListener('statechange', () => {
                            tauriLog('sfx ctx: ' + sfxCtx.state);
                        });
                    }
                    if (sfxCtx.state === 'suspended') {
                        sfxCtx.resume().catch(() => { /* rescued on gesture */ });
                    }
                    return sfxCtx;
                };
                for (const evt of ['pointerdown', 'mousedown', 'touchstart', 'keydown']) {
                    window.addEventListener(evt, () => { try { ensureSfxCtx(); } catch (_) {} }, true);
                }

                const decodeCache = new Map(); // httpUrl -> Promise<AudioBuffer>
                let cachedPcmBytes = 0;
                // Fetches through the tauri:// custom protocol are the scarcest
                // resource: a storm of parallel requests starves the handler and
                // freezes the page. Cap in-flight fetches; queue the rest.
                const MAX_INFLIGHT_FETCHES = 4;
                let inflightFetches = 0;
                const fetchQueue = [];
                const pumpFetch = () => {
                    while (inflightFetches < MAX_INFLIGHT_FETCHES && fetchQueue.length) {
                        const job = fetchQueue.shift();
                        inflightFetches++;
                        job.run().then(job.res, job.rej).finally(() => {
                            inflightFetches--;
                            pumpFetch();
                        });
                    }
                };
                const queuedFetch = (url) => new Promise((res, rej) => {
                    fetchQueue.push({
                        res, rej,
                        run: () => fetch(url.replace(ASSET_ORIGIN, 'tauri://localhost'))
                            .then((r) => {
                                if (!r.ok) throw new Error('HTTP ' + r.status);
                                return r.arrayBuffer();
                            }),
                    });
                    pumpFetch();
                });

                // Decodes are CPU-heavy; unbounded concurrency stalls the page
                // during SFX storms. Queue them, a few at a time.
                let decodingNow = 0;
                const decodeQueue = [];
                const pumpDecode = () => {
                    while (decodingNow < 3 && decodeQueue.length) {
                        const job = decodeQueue.shift();
                        decodingNow++;
                        // WebKitGTK's callback-form decodeAudioData never fires;
                        // the promise form works.
                        job.ctx.decodeAudioData(job.ab)
                            .then((buf) => { decodingNow--; job.res(buf); pumpDecode(); })
                            .catch((e) => { decodingNow--; job.rej(e); pumpDecode(); });
                    }
                };
                const queuedDecode = (ctx, ab) => new Promise((res, rej) => {
                    decodeQueue.push({ ctx, ab, res, rej });
                    pumpDecode();
                });

                const getDecoded = (url) => {
                    let p = decodeCache.get(url);
                    if (p) {
                        // LRU refresh: recent clips survive eviction.
                        decodeCache.delete(url);
                        decodeCache.set(url, p);
                        return p;
                    }
                        // Fetch via the same-scheme tauri:// origin (http:// loopback
                        // is mixed-content-blocked for fetch). Concurrency-limited:
                        // unbounded parallel fetches starve the custom protocol
                        // handler during SFX storms and stall the page.
                        p = queuedFetch(url)
                            .then((ab) => queuedDecode(ensureSfxCtx(), ab))
                            .catch((e) => {
                                decodeCache.delete(url);
                                throw e;
                            });
                        decodeCache.set(url, p);
                        p.then((buf) => {
                            cachedPcmBytes += buf.length * 4 * buf.numberOfChannels;
                            while (cachedPcmBytes > 320 * 1024 * 1024 && decodeCache.size > 4) {
                                const oldest = decodeCache.keys().next().value;
                                const op = decodeCache.get(oldest);
                                decodeCache.delete(oldest);
                                op && op.then((b) => {
                                    cachedPcmBytes = Math.max(0,
                                        cachedPcmBytes - b.length * 4 * b.numberOfChannels);
                                }).catch(() => {});
                            }
                        }).catch(() => {});
                    return p;
                };

                // --- dummy element the engine interacts with ---
                const PROPS = ['volume', 'playbackRate', 'loop', 'muted', 'preservesPitch', 'currentTime'];
                const makeDummy = (httpUrl) => {
                    const dummy = nativeCreateElement('audio');
                    dummy.__gdDummy = true;
                    dummy.__gdHttpUrl = httpUrl;
                    const state = { volume: 1, playbackRate: 1, loop: false, muted: false,
                        preservesPitch: true, currentTime: 0, __dom: true,
                        playing: false, dur: 0, playStart: 0 };
                    dummy.__gdState = state;
                    let real = null;
                    let tutimer = null;

                    const stopTutimer = () => {
                        if (tutimer) { clearInterval(tutimer); tutimer = null; }
                    };
                    const startTutimer = () => {
                        stopTutimer();
                        tutimer = setInterval(() => {
                            try { dummy.dispatchEvent(new Event('timeupdate')); } catch (_) { /* gone */ }
                        }, 250);
                    };
                    const emitPlaying = () => {
                        state.playing = true;
                        state.playStart = performance.now();
                        try { dummy.dispatchEvent(new Event('play')); } catch (_) { /* gone */ }
                        try { dummy.dispatchEvent(new Event('playing')); } catch (_) { /* gone */ }
                        startTutimer();
                    };
                    const emitStopped = (ev) => {
                        state.playing = false;
                        stopTutimer();
                        if (ev) {
                            try { dummy.dispatchEvent(new Event(ev)); } catch (_) { /* gone */ }
                        }
                    };

                    for (const p of PROPS) {
                        Object.defineProperty(dummy, p, {
                            get() { return real ? real[p] : state[p]; },
                            set(v) {
                                state[p] = v;
                                if (real) { try { real[p] = v; } catch (_) { /* gone */ } }
                            },
                            configurable: true,
                        });
                    }
                    Object.defineProperty(dummy, 'readyState', {
                        get() { return real ? real.readyState : 4; }, configurable: true,
                    });
                    Object.defineProperty(dummy, 'duration', {
                        get() { return real ? real.duration : state.dur; }, configurable: true,
                    });
                    Object.defineProperty(dummy, 'paused', {
                        get() { return real ? real.paused : !state.playing; }, configurable: true,
                    });
                    Object.defineProperty(dummy, 'currentTime', {
                        get() {
                            if (real) return real.currentTime;
                            return state.playing
                                ? (performance.now() - state.playStart) / 1000 * (state.playbackRate || 1)
                                : state.currentTime;
                        },
                        set(v) {
                            state.currentTime = v;
                            state.playStart = performance.now();
                            if (real) { try { real.currentTime = v; } catch (_) { /* gone */ } }
                        },
                        configurable: true,
                    });

                    let sfxSource = null;   // live BufferSource (short clips)
                    let sfxGain = null;

                    const dummyPlay = function () {
                        const url = dummy.__gdHttpUrl;
                        if (state.__dom) {
                            // Long clip: pooled media element (music).
                            if (!real) {
                                real = acquireReal(url);
                                for (const p of PROPS) {
                                    try { real[p] = state[p]; } catch (_) { /* gone */ }
                                }
                                if (!real.__gdBound) {
                                    real.__gdBound = true;
                                    real.addEventListener('loadedmetadata', () => {
                                        state.dur = real.duration || state.dur;
                                    });
                                    real.addEventListener('ended', () => {
                                        emitStopped('ended');
                                        releaseReal(url, real);
                                        real = null;
                                    });

                                }
                            }
                            const dur = real.duration || state.dur || 0;
                            const seek = state.currentTime > 0 && state.currentTime < dur - 0.05
                                ? state.currentTime
                                : 0;
                            try { real.currentTime = seek; } catch (_) { /* gone */ }
                            state.currentTime = 0;
                            const pr = real.play();
                            emitPlaying();
                            return pr;
                        }
                        // Short clip: WebAudio buffer source. While the context is
                        // not running (autoplay gate), REJECT: the engine's play
                        // wrapper retries on the next user gesture. Resolving here
                        // would schedule the sound into a dead context and lose it.
                        const ctx = ensureSfxCtx();
                        if (ctx.state !== 'running') {
                            return Promise.reject(new Error('sfx ctx ' + ctx.state));
                        }
                        if (sfxSource) {
                            try { sfxSource.onended = null; sfxSource.stop(); } catch (_) { /* gone */ }
                            sfxSource = null;
                        }

                        return getDecoded(url).then((buffer) => {
                            if (state.currentTime > 0 && state.currentTime < buffer.duration) {
                                buffer = buffer; // offset handled via start(when, offset)
                            }
                            const srcNode = ctx.createBufferSource();
                            srcNode.buffer = buffer;
                            srcNode.playbackRate.value = state.playbackRate || 1;
                            srcNode.loop = !!state.loop;
                            state.dur = buffer.duration;
                            sfxGain = ctx.createGain();
                            sfxGain.gain.value = state.volume != null ? state.volume : 1;
                            srcNode.connect(sfxGain);
                            sfxGain.connect(ctx.destination);
                            srcNode.onended = () => {
                                if (sfxSource === srcNode) {
                                    sfxSource = null;
                                    emitStopped('ended');
                                }
                            };
                            sfxSource = srcNode;
                            const offset = Math.min(state.currentTime || 0, Math.max(0, buffer.duration - 0.01));
                            srcNode.start(0, offset);
                            state.currentTime = 0;
                            emitPlaying();
                        }).catch((e) => {
                            tauriLog('sfx play failed: ' + e);
                        });
                    };
                    dummy.pause = function () {
                        if (sfxSource) {
                            try { sfxSource.onended = null; sfxSource.stop(); } catch (_) { /* gone */ }
                            sfxSource = null;
                            emitStopped('pause');
                        }
                        if (real) {
                            try { real.pause(); } catch (_) { /* gone */ }
                            emitStopped('pause');
                            setTimeout(() => {
                                if (real && real.paused) {
                                    releaseReal(dummy.__gdHttpUrl, real);
                                    real = null;
                                }
                            }, 5000);
                        }
                    };
                    dummy.play = function (...args) {
                        // A click can arrive before the routing decode finishes;
                        // committing to DOM in that window made rapid UI clicks
                        // steal each other's pooled elements. Wait for routing —
                        // click-sized clips decode in tens of milliseconds.
                        if (!state.__routed && dummy.__gdRouteReady) {
                            return dummy.__gdRouteReady.then(() => dummyPlay(...args));
                        }
                        return dummyPlay(...args);
                    };
                    dummy.load = function () { /* dummies never load anything */ };
                    dummy.__gdUnbind = function () {
                        if (sfxSource) {
                            try { sfxSource.onended = null; sfxSource.stop(); } catch (_) { /* gone */ }
                            sfxSource = null;
                        }
                        if (real) {
                            try { real.pause(); } catch (_) { /* gone */ }
                            releaseReal(dummy.__gdHttpUrl, real);
                            real = null;
                        }
                        state.playing = false;
                        stopTutimer();
                    };
                    return dummy;
                };

                // Called by the patched engine loader instead of createElement.
                // Route by DECODED DURATION: clips <=30s play through WebAudio
                // (buffer sources, zero pipelines); longer ones are music and keep
                // the pooled media element. Long buffers are not cached (huge).
                window.__gdAcquireAudio = (rawUrl) => {
                    const httpUrl = rewriteMediaUrl(rawUrl);
                    if (!httpUrl) return nativeCreateElement('audio');
                    const dummy = makeDummy(httpUrl);
                    dummy.__gdRouteReady = getDecoded(httpUrl).then((buffer) => {
                        dummy.__gdState.__routed = true;
                        if (buffer.duration > 30) {
                            dummy.__gdState.__dom = true;
                            decodeCache.delete(httpUrl); // don't hold long PCM
                        } else {
                            dummy.__gdState.__dom = false;
                        }
                    }).catch(() => { /* stays on DOM path; decode failure logged */ });
                    return dummy;
                };

                // The engine waits for canplaythrough on the element it receives;
                // dummies are "instantly loaded", so replay the event synthetically.
                const aelOrig = EventTarget.prototype.addEventListener;
                EventTarget.prototype.addEventListener = function (type, listener, ...rest) {
                    if (
                        this instanceof HTMLMediaElement &&
                        this.__gdDummy &&
                        (type === 'canplaythrough' || type === 'canplay' || type === 'loadedmetadata')
                    ) {
                        const el = this;
                        queueMicrotask(() => {
                            try { el.dispatchEvent(new Event(type)); } catch (_) { /* gone */ }
                        });
                    }
                    return aelOrig.call(this, type, listener, ...rest);
                };

                Object.defineProperty(HTMLMediaElement.prototype, 'src', {
                    ...srcDescriptor,
                    set(url) {
                        if (typeof url === 'string') {
                            const httpUrl = rewriteMediaUrl(url);
                            if (httpUrl) {
                                if (this.__gdDummy) {
                                    // Dummies never load: just remember the clip URL.
                                    // A URL change on a live dummy (song switch) must
                                    // unbind and stop its pooled real element.
                                    if (this.__gdHttpUrl !== httpUrl && this.__gdUnbind) {
                                        this.__gdUnbind();
                                    }
                                    this.__gdHttpUrl = httpUrl;
                                    return;
                                }
                                // Re-assigning the same URL restarts the whole media
                                // pipeline; skip when the element already points at it.
                                if (srcDescriptor.get.call(this) !== httpUrl) {
                                    srcDescriptor.set.call(this, httpUrl);
                                }
                                return;
                            }
                        }
                        srcDescriptor.set.call(this, url);
                    },
                });

                // Safety net for code paths that assign the attribute directly.
                const nativeSetAttribute = Element.prototype.setAttribute;
                Element.prototype.setAttribute = function (name, value) {
                    if (
                        this instanceof HTMLMediaElement &&
                        String(name).toLowerCase() === 'src' &&
                        typeof value === 'string' &&
                        rewriteMediaUrl(value)
                    ) {
                        this.src = value; // routed through the src setter above
                        return;
                    }
                    return nativeSetAttribute.call(this, name, value);
                };

                // The HTMLAudioElement constructor sets src internally (C++ level),
                // which bypasses the property/attribute hooks above.
                const NativeAudio = window.Audio;
                window.Audio = function (url) {
                    const element = new NativeAudio();
                    if (typeof url === 'string' && url) {
                        element.src = url;
                    }
                    return element;
                };
                window.Audio.prototype = NativeAudio.prototype;

                tauriLog('WebKitGTK media: dummy-element proxy + pooled real pipelines enabled');

            })();
        </script>
