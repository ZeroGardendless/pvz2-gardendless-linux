[package]
name = "gardendless"
version = "0.15.0"
description = "Gardendless game and launcher"
authors = ["ZeroGardendless"]
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "devtools", "custom-protocol" ] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-drpc = "0.1.6"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2.7.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Build speed + binary size: strip debug symbols (the release binary was 1.3GB),
# keep incremental dev builds fast, and avoid full LTO link blowups.
[profile.release]
strip = true
incremental = false
debug = 0
# Avoid the very long whole-program link step for this asset-heavy desktop app.
# Disabling incremental release builds also avoids retaining compiler state in
# target/ between releases.
lto = false
panic = "abort"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
